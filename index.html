<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Space Invaders</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 8'%3E%3Cpath fill='%2300ff41' d='M2 0h1v1H2zM8 0h1v1H8zM3 1h1v1H3zM7 1h1v1H7zM2 2h7v1H2zM1 3h2v1H1zM4 3h3v1H4zM8 3h2v1H8zM0 4h11v1H0zM0 5h2v1H0zM3 5h5v1H3zM8 5h2v1H8zM0 6h1v1H0zM2 6h7v1H2zM10 6h1v1H10zM3 7h2v1H3zM6 7h2v1H6z'/%3E%3C/svg%3E"/>
<style>
  html, body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    background: #111;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  #topbar { display: none; }
  body.mobile #topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 40px;
    padding: 0 12px;
    flex: 0 0 40px;
  }
  #topbar button {
    width: 44px;
    height: 32px;
    font-size: 16px;
    line-height: 1;
    color: #eee;
    background: #222;
    border: 1px solid #444;
    border-radius: 6px;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #stage {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    justify-items: center;
  }
  #canvaswrap { line-height: 0; }
  #game {
    display: block;
    background: #000;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 48px rgba(0,0,0,0.8);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  #movezone, #firezone {
    height: 100%;
    justify-self: stretch;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body.mobile #movezone { background: rgba(255,255,255,0.05); }
  body.mobile #firezone { background: rgba(255,70,70,0.08); }
  body.mobile.land #stage { grid-template-columns: minmax(96px, 1fr) auto minmax(96px, 1fr); padding: 0 8px; }
  body.mobile.port #stage {
    grid-template-columns: 3fr 2fr;
    grid-template-rows: minmax(0, 1fr) 110px;
  }
  body.mobile.port #canvaswrap { grid-column: 1 / -1; grid-row: 1; align-self: start; }
  body.mobile.port #firezone { grid-column: 2; grid-row: 2; }
  #hint { display: none; }
  body.mobile.port #hint {
    display: block;
    text-align: center;
    color: #777;
    font: 11px/1.4 monospace;
    padding: 4px 0 8px;
  }
  #loading { position: fixed; top: 10px; left: 12px; color: #7f7; font: 12px/1.4 monospace; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
</style>
</head>
<body>
<div id="topbar">
  <button id="pausebtn" aria-label="pause">&#9208;</button>
  <button id="mutebtn" aria-label="mute">&#128266;</button>
</div>
<div id="stage">
  <div id="movezone"></div>
  <div id="canvaswrap"><canvas id="game" width="256" height="224"></canvas></div>
  <div id="firezone"></div>
</div>
<div id="hint">tip: rotate for more room</div>
<div id="loading">Loading...</div>
<script src="wasm_exec.js"></script>
<script type="module">
  const W = 256, H = 224;
  const TOPBAR_H = 40, MIN_ZONE = 96, CTRL_BAR_H = 110, HINT_H = 24, PAD = 8;
  const canvas = document.getElementById("game");
  const movezone = document.getElementById("movezone");
  const firezone = document.getElementById("firezone");
  const pausebtn = document.getElementById("pausebtn");
  const mutebtn = document.getElementById("mutebtn");
  const loading = document.getElementById("loading");

  const coarse = matchMedia("(pointer: coarse)").matches;
  let scale = 1;

  function setScale(s) {
    scale = s;
    canvas.style.width = (W * s) + "px";
    canvas.style.height = (H * s) + "px";
  }

  // layout sizes the play area for the current viewport and orientation.
  // The fine-pointer path is the exact phase-7 layout: integer scale,
  // centered. Mobile uses float scales.
  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    document.body.classList.toggle("mobile", coarse);
    if (!coarse) {
      document.body.classList.remove("land", "port");
      const s = Math.max(1, Math.min(
        Math.floor((vw - 32) / W),
        Math.floor((vh - 32) / H),
      ));
      setScale(s);
      return;
    }
    if (vw > vh) {
      const availW = vw - 2 * MIN_ZONE - PAD * 2;
      const availH = vh - TOPBAR_H - PAD * 2;
      const s = Math.min(availW / W, availH / H);
      if (s * W >= 128) {
        document.body.classList.add("land");
        document.body.classList.remove("port");
        setScale(s);
        return;
      }
    }
    // Portrait, or a landscape viewport too narrow for two zones.
    document.body.classList.add("port");
    document.body.classList.remove("land");
    const availH = vh - TOPBAR_H - CTRL_BAR_H - HINT_H - PAD * 2;
    setScale(Math.min((vw - PAD * 2) / W, availH / H));
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);
  layout();

  const state = () => (window.main ? main.state() : null);
  const inMenu = (st) => st && (st.stateName === "start" || st.stateName === "gameover");

  function unlock() { if (window.main) main.unlock(); }
  // Window-level: the first press unlocks audio. In the menus, a press
  // anywhere except the top bar acts as Enter.
  let menuPointerId = null;
  window.addEventListener("pointerdown", (e) => {
    unlock();
    if (e.target.closest && e.target.closest("#topbar")) return;
    if (!inMenu(state())) return;
    menuPointerId = e.pointerId;
    main.setKey("Enter", true);
  });
  window.addEventListener("pointerup", (e) => {
    if (e.pointerId !== menuPointerId) return;
    menuPointerId = null;
    main.setKey("Enter", false);
  });

  // Move zone: anchored 1:1 drag. The first pointer wins; HTML only
  // forwards deltas, Go owns the ship position.
  const pointerXLogical = (e) => (e.clientX - canvas.getBoundingClientRect().left) / scale;
  let moveId = null, anchor = 0, lastMoveX = 0;
  movezone.addEventListener("pointerdown", (e) => {
    if (moveId !== null) return;
    if (inMenu(state())) return;
    moveId = e.pointerId;
    anchor = pointerXLogical(e) - state().playerX;
    lastMoveX = pointerXLogical(e);
    movezone.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  movezone.addEventListener("pointermove", (e) => {
    if (e.pointerId !== moveId) return;
    const x = pointerXLogical(e);
    main.move(x - lastMoveX);
    lastMoveX = x;
  });
  const releaseMove = (e) => {
    if (e.pointerId !== moveId) return;
    moveId = null;
    if (movezone.hasPointerCapture(e.pointerId)) movezone.releasePointerCapture(e.pointerId);
    if (window.main) main.moveEnd();
  };
  movezone.addEventListener("pointerup", releaseMove);
  movezone.addEventListener("pointercancel", releaseMove);

  // Fire zone: edge-triggered like Space; holding does not re-fire.
  let fireId = null;
  firezone.addEventListener("pointerdown", (e) => {
    if (fireId !== null) return;
    if (inMenu(state())) return;
    fireId = e.pointerId;
    main.setKey("Space", true);
    e.preventDefault();
  });
  const releaseFire = (e) => {
    if (e.pointerId !== fireId) return;
    fireId = null;
    main.setKey("Space", false);
  };
  firezone.addEventListener("pointerup", releaseFire);
  firezone.addEventListener("pointerleave", releaseFire);
  firezone.addEventListener("pointercancel", releaseFire);

  // Top bar: pointerdown, not click.
  pausebtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (!window.main) return;
    main.setKey("KeyP", true);
    main.setKey("KeyP", false);
  });
  mutebtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (window.main) main.setKey("KeyM", true);
  });
  setInterval(() => {
    const st = state();
    if (!st) return;
    pausebtn.textContent = st.stateName === "paused" ? "\u25B6" : "\u23F8";
    mutebtn.textContent = st.muted ? "\uD83D\uDD07" : "\uD83D\uDD0A";
  }, 500);

  for (const z of [movezone, firezone]) {
    z.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  const handled = new Set([
    "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
    "Space", "Enter", "KeyA", "KeyD", "KeyP", "KeyM",
  ]);
  window.addEventListener("keydown", (e) => {
    if (!handled.has(e.code)) return;
    e.preventDefault();
    unlock();
    if (e.repeat) return;
    if (window.main) main.setKey(e.code, true);
  });
  window.addEventListener("keyup", (e) => {
    if (!handled.has(e.code)) return;
    e.preventDefault();
    if (window.main) main.setKey(e.code, false);
  });

  const go = new Go();
  const bytes = await (await fetch("main.wasm")).arrayBuffer();
  const { instance } = await WebAssembly.instantiate(bytes, go.importObject);
  go.run(instance);
  loading.remove();

  function frame() {
    if (window.main) main.tick(performance.now());
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
